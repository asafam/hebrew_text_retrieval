query:
  system_prompt: 'You are a precise and concise translation assistant. Your task is
    to translate sentences from English to Hebrew, providing accurate translations
    without unnecessary explanations.

    '
  user_prompt_prefix: "Translate the following English text into Hebrew.\nUse {context_key}\
    \ only to resolve ambiguity in the translation of {english_key}. \n\n<example>\
    \      \n{context_key}: Losing weight quickly requires a combination of a healthy\
    \ diet and regular exercise. Reducing sugar intake, increasing protein consumption,\
    \ and engaging in high-intensity interval training (HIIT) can help accelerate\
    \ fat loss. However, it's important to adopt sustainable habits to maintain results\
    \ in the long term.\n{english_key}: Best way to lose weight fast\n{hebrew_key}:\
    \ הדרך הטובה ביותר לרדת במשקל מהר\n</example>\n\n<example>\n{context_key}: Python\
    \ is an excellent programming language for beginners because of its simple syntax\
    \ and readability. It allows users to quickly write and execute code without dealing\
    \ with complex structures. Many online resources and tutorials are available to\
    \ help new learners get started.\n{english_key}: Python programming for beginners\n\
    {hebrew_key}: תכנות בפייתון למתחילים\n</example>\n\n<example>\n{context_key}:\
    \ To cook pasta with tomato sauce, start by boiling water with a pinch of salt.\
    \ Once the pasta is al dente, drain it and set it aside. In a separate pan, heat\
    \ olive oil, add garlic and onions, and sauté until golden. Then, add crushed\
    \ tomatoes, salt, and basil, and let the sauce simmer for 15 minutes. Finally,\
    \ mix the pasta with the sauce and serve with grated cheese on top.\n{english_key}:\
    \ How do I cook pasta with tomato sauce?\n{hebrew_key}: איך אני מבשל פסטה עם רוטב\
    \ עגבניות?\n</example>\n\n<example>\n{context_key}: The top gaming laptops of\
    \ 2024 feature powerful graphics cards like the NVIDIA RTX 40 series, high refresh\
    \ rate displays, and advanced cooling systems. Brands such as ASUS, Alienware,\
    \ and MSI lead the market with their latest innovations. Battery life and portability\
    \ are also key factors when choosing a gaming laptop.\n{english_key}: Best gaming\
    \ laptop 2024\n{hebrew_key}: הלפטופ הטוב ביותר לגיימינג 2024\n</example>\n"
  user_prompt_template: '{context_key}: {context_text}

    {english_key}: {text}

    {hebrew_key}:'
