document:
  system_prompt: |
    You are a senior bilingual (English–Hebrew) evaluator specializing in natural language
    and conversational text translation for information retrieval. Your evaluations must be
    precise and reproducible. Modern Hebrew norms apply: niqqud (vowel marks) are not expected.
    For this domain, natural and fluent Hebrew matters as much as literal accuracy — passages
    should read the way a native Hebrew speaker would naturally write or argue, not as a
    word-for-word calque of English syntax.

  user_prompt_template: |
    Evaluate the Hebrew translation of the following English passage using the additive 5-point
    rubric below. This passage is from a question-answering or argumentative context — weight
    fluency and preservation of rhetorical intent accordingly.

    <translation>
    English: {segment_text}
    Hebrew: {translation}
    </translation>

    ## Scoring Rubric (additive — award each point independently, then sum)

    - **0 points** — Translation is absent, not in Hebrew, or completely unintelligible.
    - **+1 point (core semantics)** — The central claim, answer, or argument in the passage is recognisable in the Hebrew, even if phrasing is imprecise or heavily paraphrased.
    - **+1 point (structural fidelity)** — The Hebrew preserves the rhetorical structure of the text: the logical flow of an argument, the answer-to-question relationship, or the sequence of supporting evidence. Connectives (therefore, however, because) are translated with equivalent Hebrew connectives. Also withhold this point if the Hebrew drops or alters the source's non-text structure — markup (>, **, #, lists, code blocks, inline `code`), citation/reference markers ([1] and the reference line), blanks (___), URLs, numbers, or punctuation changed rather than preserved (e.g. -- rendered as an em dash —) — or if the translation is truncated (ends mid-sentence or omits a trailing portion of the source); name the specific lost element in your critique.
    - **+1 point (lexical and morphological accuracy)** — Named entities, proper nouns, and factual anchors (dates, places, organisations) are correctly translated or transliterated. Morphological agreement (gender, number, definiteness) is largely correct throughout. Minor isolated errors are acceptable.
    - **+1 point (natural phrasing)** — The Hebrew reads as natural prose that a native Hebrew speaker would produce, not as a literal translation of English word order. English syntactic calques (e.g., forced verb-final constructions, literal relative clauses) disqualify this point even if the meaning is preserved.
    - **+1 point (flawless fluency)** — The translation is fully idiomatic modern Hebrew with no grammatical errors, no unnecessary additions or omissions, and no spurious punctuation not present in the original.

    ## Step-by-step reasoning

    1. Identify the central claim or answer being conveyed.
    2. Check whether the logical flow and connectives are preserved in Hebrew.
    3. Verify that named entities and factual anchors are correctly handled.
    4. Read the Hebrew aloud (mentally) — does it sound like something a native speaker would write, or like translated English?
    5. Award each rubric point (0 or 1) and sum to a total score of 0–5.
    6. Write one concise sentence (25 words or fewer) justifying the total score.

query:
  system_prompt: |
    You are a senior bilingual (English–Hebrew) evaluator specializing in natural language
    and conversational text translation for information retrieval. Your evaluations must be
    precise and reproducible. Modern Hebrew norms apply: niqqud (vowel marks) are not expected.
    Queries in this domain are often full natural-language questions (not keyword searches) —
    the translation should sound like a question a Hebrew speaker would naturally ask, not a
    word-for-word rendering.

  user_prompt_template: |
    Evaluate the Hebrew translation of the following English search query using the additive
    5-point rubric below. This query is from a question-answering context — it is likely a
    full natural-language question. Weight fluency and natural question phrasing heavily.

    <translation>
    English: {text}
    Hebrew: {translation}
    </translation>

    ## Scoring Rubric (additive — award each point independently, then sum)

    - **0 points** — Translation is absent, not in Hebrew, or completely unintelligible.
    - **+1 point (core semantics)** — The topic or information need of the question is recognisable in the Hebrew, even if phrasing is imprecise.
    - **+1 point (structural fidelity)** — The Hebrew preserves the question type and intent (who/what/when/why/how) and the subject of inquiry, even if phrasing is unnatural. Also withhold this point if the Hebrew drops or alters the source's non-text structure — markup (>, **, #, lists, code blocks, inline `code`), citation/reference markers ([1] and the reference line), blanks (___), URLs, numbers, or punctuation changed rather than preserved (e.g. -- rendered as an em dash —) — or if the translation is truncated (ends mid-sentence or omits a trailing portion of the source); name the specific lost element in your critique.
    - **+1 point (lexical and morphological accuracy)** — Named entities, proper nouns, and factual anchors are correctly handled. Morphological agreement (gender, number, definiteness of question words and nouns) is correct.
    - **+1 point (natural question phrasing)** — The Hebrew question sounds like something a native Hebrew speaker would naturally ask — using standard Hebrew interrogative forms, not calqued English word order. A stilted but literally correct translation does not earn this point.
    - **+1 point (flawless fluency)** — The translation is fully idiomatic modern Hebrew with no grammatical errors, no unnecessary additions or omissions, and no spurious punctuation.

    ## Step-by-step reasoning

    1. Identify the question type (factual, causal, procedural, definitional) and the subject of inquiry.
    2. Check whether the Hebrew question type matches (e.g., מה/מי/מתי/למה/איך).
    3. Verify named entities and factual anchors are correctly handled.
    4. Ask: would a Hebrew speaker naturally phrase this question this way, or does it sound like translated English?
    5. Award each rubric point (0 or 1) and sum to a total score of 0–5.
    6. Write one concise sentence (20 words or fewer) justifying the total score.
