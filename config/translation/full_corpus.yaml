# BeIR Full Corpus Translation
# Translates all queries and documents across all 12 BeIR datasets.
#
# Run queries:
#   python -m translation.api.run_beir_translation_pipeline \
#       --config config/translation/full_corpus.yaml --text-type query
#
# Run documents (after queries pass QA):
#   python -m translation.api.run_beir_translation_pipeline \
#       --config config/translation/full_corpus.yaml --text-type document
#
# CI / non-interactive (skip cost confirmation):
#   python -m translation.api.run_beir_translation_pipeline \
#       --config config/translation/full_corpus.yaml --text-type query --yes

run_id: "full_corpus_zeroshot_nocontext_gpt54mini"

model:
  name: "gpt-5.4-mini"
  temperature: 0.7

prompt:
  file: "prompts/translation/api/translation/translation_prompts_zeroshot_nocontext_v20250220.yaml"
  response_format: "Translation"
  english_key: "Text"
  hebrew_key: "Translation"
  context_key: "Context"
  hebrew_key_query: "Hebrew Query"
  hebrew_key_document: "Hebrew Document"

datasets:
  names:
    # Ordered small → large for natural phasing
    - "BeIR/nfcorpus"        # 3,633 docs
    - "BeIR/scifact"          # 5,183 docs
    - "BeIR/arguana"          # 8,674 docs
    - "BeIR/scidocs"          # 25,657 docs
    - "BeIR/trec-covid"       # 171,332 docs
    - "BeIR/quora"            # 522,931 docs
    - "BeIR/nq"               # 2,681,468 docs
    - "BeIR/hotpotqa"         # 5,233,329 docs
    - "BeIR/dbpedia-entity"   # 4,635,922 docs
    - "BeIR/fever"            # 5,416,568 docs  (Wikipedia corpus — shared with climate-fever)
    - "BeIR/climate-fever"    # 5,416,593 docs  (same Wikipedia corpus)
    - "BeIR/msmarco"          # 8,841,823 docs
  num_samples: 0              # 0 = translate all records
  max_document_segment_tokens: 512
  tokenizer_model: "gpt-4o-mini-2024-07-18"
  translate_titles: true
  random_seed: 42

execution:
  mode: "auto"                # auto → batch API for gpt-* models
  num_workers: 8
  sleep_time: 0
  limit: 0                    # 0 = no limit
  force_candidates: false
  force_translation: false
  force_export: false

paths:
  candidates_base: "outputs/translation/BeIR/full_corpus"
  runs_base: "outputs/beir_translation/full_corpus"

batch:
  poll_interval_seconds: 3600   # Poll every hour (free)
  max_wait_hours: 72            # Large datasets may take up to 3 days
  job_tracking_dir: "jobs/full_corpus"

export:
  segment_separator: " "
  include_context: false

# ── Guardrails ────────────────────────────────────────────────────────────────
guardrails:
  max_cost_usd: 2500.0
  cost_per_1m_input_tokens: 0.075    # gpt-5.4-mini batch API rate
  cost_per_1m_output_tokens: 0.300

# ── Progressive translation ───────────────────────────────────────────────────
# Translate pilot_n rows first, optionally QA them, then continue with the rest.
# Set pilot_n: 0 to skip the pilot and translate everything in one pass.
progression:
  pilot_n: 100        # Translate 100 rows first as a smoke test
  pilot_qa: true      # Run LLM-as-a-judge on the pilot before scaling up

# ── Per-dataset QA ────────────────────────────────────────────────────────────
qa:
  enabled: true
  baseline_csv: "outputs/translation/BeIR/results_translation_eval.csv"
  baseline_model: "gpt-5.4-mini"
  baseline_prompt: "zeroshot_nocontext"
  judge_model: "claude-sonnet-4-6"
  sample_size: 25
  workers: 4
